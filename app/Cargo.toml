[package]
name = "voxen"
version = "0.1.0"
edition = "2024"
description = "Voxen: your team of voices"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voice-bots = { path = ".." }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
